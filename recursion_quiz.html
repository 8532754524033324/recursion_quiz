<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>再帰トレース道場 — 行きがけ・帰りがけ100本ノック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<style>
  :root {
    --bg: #0F1117;
    --bg-raised: #171A23;
    --bg-card: #1B1F2A;
    --border: #2A2F3D;
    --border-soft: #232733;
    --text: #E7E9EF;
    --text-dim: #9AA1B4;
    --text-faint: #6B7288;
    --accent: #E8B339;
    --accent-dim: #A9822E;
    --good: #4FD1C5;
    --good-bg: #133432;
    --bad: #FF7A7A;
    --bad-bg: #3A1C22;
    --code-bg: #12141C;
    --code-border: #262A38;
    --code-text: #E7E9EF;
    --code-text-dim: #9AA1B4;
    --code-keyword: #F6A0C7;
    --code-string: #A8E6A1;
    --code-number: #F6C177;
    --code-function: #7FD8E8;
    --code-punct: #9AA1B4;
    --code-comment: #6B7288;
    --radius: 10px;
    --font-ui: 'Space Grotesk', system-ui, sans-serif;
    --font-code: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F3F2ED;
      --bg-raised: #FFFFFF;
      --bg-card: #FFFFFF;
      --border: #DEDBD1;
      --border-soft: #E7E4DA;
      --text: #211F1A;
      --text-dim: #5C594F;
      --text-faint: #8C887B;
      --accent: #B4780F;
      --accent-dim: #8A5D0C;
      --good: #0F7A6C;
      --good-bg: #E1F3EF;
      --bad: #C24545;
      --bad-bg: #FBE7E7;
      --code-bg: #1B1E27;
      --code-border: #2A2E3B;
      color-scheme: light;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0F1117;
    --bg-raised: #171A23;
    --bg-card: #1B1F2A;
    --border: #2A2F3D;
    --border-soft: #232733;
    --text: #E7E9EF;
    --text-dim: #9AA1B4;
    --text-faint: #6B7288;
    --accent: #E8B339;
    --accent-dim: #A9822E;
    --good: #4FD1C5;
    --good-bg: #133432;
    --bad: #FF7A7A;
    --bad-bg: #3A1C22;
    --code-bg: #12141C;
    --code-border: #262A38;
    color-scheme: dark;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 18px 64px;
  }

  /* ---------- Header ---------- */
  header.top {
    margin-bottom: 20px;
  }

  .eyebrow-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: clamp(1.35rem, 1.1rem + 1vw, 1.9rem);
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    line-height: 1.2;
  }

  h1 .accent { color: var(--accent); }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin: 0 0 18px;
    max-width: 60ch;
    line-height: 1.5;
  }

  .stats-row {
    display: flex;
    gap: 18px;
    font-family: var(--font-code);
    font-size: 0.82rem;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .stats-row b { color: var(--text); font-weight: 600; }
  .stats-row .good-text { color: var(--good); }
  .stats-row .bad-text { color: var(--bad); }

  .progress-track {
    margin-top: 10px;
    height: 6px;
    border-radius: 4px;
    background: var(--border-soft);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width .3s ease;
  }

  /* ---------- Mode + filter controls ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
  }

  .mode-toggle {
    display: inline-flex;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    width: fit-content;
    gap: 2px;
  }
  .mode-toggle button {
    font-family: var(--font-ui);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: #1A1300;
  }

  .chip-row {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }
  .chip-row::-webkit-scrollbar { height: 5px; }
  .chip-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .chip {
    flex: 0 0 auto;
    font-family: var(--font-code);
    font-size: 0.76rem;
    padding: 6px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--text-dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip[data-active="true"] {
    border-color: var(--cat-color, var(--accent));
    color: var(--text);
    background: color-mix(in srgb, var(--cat-color, var(--accent)) 16%, var(--bg-raised));
  }
  .chip .count { color: var(--text-faint); margin-left: 4px; }

  /* ---------- Card ---------- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    position: relative;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .cat-tag {
    font-family: var(--font-code);
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 6px;
    background: color-mix(in srgb, var(--cat-color) 18%, transparent);
    color: var(--cat-color);
    border: 1px solid color-mix(in srgb, var(--cat-color) 45%, transparent);
  }

  .q-index {
    font-family: var(--font-code);
    font-size: 0.78rem;
    color: var(--text-faint);
  }

  pre[class*="language-"] {
    background: var(--code-bg) !important;
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--font-code);
    font-size: 0.82rem;
    line-height: 1.6;
    overflow-x: auto;
    margin: 0 0 16px;
    color: var(--code-text) !important;
  }
  code[class*="language-"] {
    font-family: var(--font-code) !important;
    text-shadow: none !important;
    color: var(--code-text) !important;
    background: none !important;
  }

  /* Prism token colors — fixed regardless of light/dark page theme,
     since the code block itself always uses a dark "console" background */
  .token.comment { color: var(--code-comment); font-style: italic; }
  .token.keyword,
  .token.control-flow { color: var(--code-keyword); }
  .token.string,
  .token.template-string { color: var(--code-string); }
  .token.number,
  .token.boolean { color: var(--code-number); }
  .token.function { color: var(--code-function); }
  .token.punctuation,
  .token.operator { color: var(--code-punct); }
  .token.interpolation-punctuation,
  .token.interpolation { color: var(--code-text); }
  .token.constant,
  .token.class-name { color: var(--code-number); }

  .tree-ascii {
    font-family: var(--font-code);
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--code-text-dim);
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: 8px;
    padding: 10px 14px;
    margin: 0 0 14px;
    white-space: pre;
    overflow-x: auto;
  }

  .prompt-text {
    font-size: 1rem;
    line-height: 1.6;
    margin: 0 0 18px;
    white-space: pre-line;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 6px;
  }

  .opt-btn {
    text-align: left;
    font-family: var(--font-code);
    font-size: 0.85rem;
    line-height: 1.5;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
    word-break: break-word;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent-dim);
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    background: var(--good-bg);
    border-color: var(--good);
    color: var(--good);
  }
  .opt-btn.incorrect {
    background: var(--bad-bg);
    border-color: var(--bad);
    color: var(--bad);
  }
  .opt-btn.reveal-correct {
    border-color: var(--good);
    color: var(--good);
  }

  .explain {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 8px;
    background: var(--bg-raised);
    border: 1px solid var(--border-soft);
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--text-dim);
    display: none;
  }
  .explain.show { display: block; }
  .explain .verdict {
    font-weight: 600;
    font-family: var(--font-ui);
    display: block;
    margin-bottom: 6px;
    font-size: 0.92rem;
  }
  .explain .verdict.good { color: var(--good); }
  .explain .verdict.bad { color: var(--bad); }

  .flash-reveal-btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.86rem;
    background: var(--accent);
    color: #1A1300;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
  }

  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 10px;
  }

  .nav-btn {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 0.85rem;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .nav-btn:hover { border-color: var(--accent-dim); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn.primary {
    background: var(--accent);
    color: #1A1300;
    border-color: var(--accent);
  }

  .jump-input {
    font-family: var(--font-code);
    font-size: 0.8rem;
    width: 52px;
    text-align: center;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 4px;
  }

  footer.foot {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.76rem;
    margin-top: 26px;
    font-family: var(--font-code);
  }

  button:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="eyebrow-row">
      <h1>再帰トレース道場<br><span class="accent">行きがけ・帰りがけ 100本ノック</span></h1>
    </div>
    <p class="subtitle">JavaScript の再帰関数をコードで読み、実行順序と各コンテキストの変数の値を手で追いかけて理解するための練習問題集です。</p>
    <div class="stats-row">
      <span>進捗 <b id="stat-progress">0 / 100</b></span>
      <span>正解 <b class="good-text" id="stat-correct">0</b></span>
      <span>不正解 <b class="bad-text" id="stat-wrong">0</b></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </header>

  <div class="controls">
    <div class="mode-toggle" id="mode-toggle">
      <button data-mode="quiz" class="active">クイズモード</button>
      <button data-mode="flash">復習モード（フラッシュカード）</button>
    </div>
    <div class="chip-row" id="chip-row"></div>
  </div>

  <div class="card" id="card">
    <div class="card-head">
      <span class="cat-tag" id="cat-tag"></span>
      <span class="q-index" id="q-index"></span>
    </div>

    <div id="tree-ascii-slot"></div>
    <pre id="code-pre" class="language-javascript"><code id="code-block" class="language-javascript"></code></pre>

    <p class="prompt-text" id="prompt-text"></p>

    <div class="options" id="options"></div>

    <div id="flash-reveal-wrap" style="display:none;">
      <button class="flash-reveal-btn" id="flash-reveal-btn">答えを見る</button>
    </div>

    <div class="explain" id="explain">
      <span class="verdict" id="verdict"></span>
      <span id="explain-text"></span>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prev-btn">← 前へ</button>
      <div style="display:flex; align-items:center; gap:8px;">
        <input class="jump-input" id="jump-input" type="text" inputmode="numeric" placeholder="#">
        <button class="nav-btn" id="jump-btn">移動</button>
      </div>
      <button class="nav-btn primary" id="next-btn">次へ →</button>
    </div>
  </div>

  <footer class="foot">全100問 &middot; 行きがけ / 帰りがけ / コンテキスト変数 / 配列構築 / 木構造 / 文字列・数値計算 / 総合応用</footer>
</div>

<script>
(function () {
  "use strict";

  const RAW = document.getElementById('quiz-data').textContent;
  const QUESTIONS = JSON.parse(RAW);

  const CATS = [
    { id: 'all',  label: '全て',              color: '#E8B339' },
    { id: 'pre',  label: '行きがけのみ',        color: '#4FD1C5' },
    { id: 'post', label: '帰りがけのみ',        color: '#7C9EFF' },
    { id: 'both', label: '行き＋帰り',          color: '#C792EA' },
    { id: 'ctx',  label: 'コンテキスト変数',     color: '#FF9F68' },
    { id: 'arr',  label: '配列構築',           color: '#6EE7B7' },
    { id: 'tree', label: '木構造',             color: '#F6C177' },
    { id: 'calc', label: '文字列・数値計算',     color: '#87CEFA' },
    { id: 'adv',  label: '総合応用',           color: '#FF7A7A' },
  ];

  const catMeta = {};
  CATS.forEach(c => catMeta[c.id] = c);

  // ---------- state ----------
  let state = {
    mode: 'quiz',            // 'quiz' | 'flash'
    filter: 'all',
    order: QUESTIONS.map(q => q.id),
    pos: 0,                  // index into `order`
    answers: {},              // id -> { chosenIndex, correct }
    revealed: {}              // id -> true (flashcard revealed)
  };

  function loadState() {
    try {
      const raw = localStorage.getItem('recursion-quiz-state-v1');
      if (raw) {
        const parsed = JSON.parse(raw);
        state.answers = parsed.answers || {};
        state.revealed = parsed.revealed || {};
      }
    } catch (e) { /* ignore */ }
  }
  function saveState() {
    try {
      localStorage.setItem('recursion-quiz-state-v1', JSON.stringify({
        answers: state.answers,
        revealed: state.revealed
      }));
    } catch (e) { /* ignore */ }
  }
  loadState();

  function currentOrder() {
    if (state.filter === 'all') return QUESTIONS.map(q => q.id);
    return QUESTIONS.filter(q => q.category === state.filter).map(q => q.id);
  }

  function byId(id) { return QUESTIONS.find(q => q.id === id); }

  // ---------- DOM refs ----------
  const chipRow = document.getElementById('chip-row');
  const catTag = document.getElementById('cat-tag');
  const qIndex = document.getElementById('q-index');
  const codeBlock = document.getElementById('code-block');
  const codePre = document.getElementById('code-pre');
  const treeSlot = document.getElementById('tree-ascii-slot');
  const promptText = document.getElementById('prompt-text');
  const optionsEl = document.getElementById('options');
  const explainEl = document.getElementById('explain');
  const verdictEl = document.getElementById('verdict');
  const explainTextEl = document.getElementById('explain-text');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const jumpInput = document.getElementById('jump-input');
  const jumpBtn = document.getElementById('jump-btn');
  const flashRevealWrap = document.getElementById('flash-reveal-wrap');
  const flashRevealBtn = document.getElementById('flash-reveal-btn');
  const statProgress = document.getElementById('stat-progress');
  const statCorrect = document.getElementById('stat-correct');
  const statWrong = document.getElementById('stat-wrong');
  const progressFill = document.getElementById('progress-fill');
  const modeToggle = document.getElementById('mode-toggle');

  // ---------- chips ----------
  function renderChips() {
    chipRow.innerHTML = '';
    CATS.forEach(c => {
      const count = c.id === 'all' ? QUESTIONS.length : QUESTIONS.filter(q => q.category === c.id).length;
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      chip.style.setProperty('--cat-color', c.color);
      chip.dataset.active = String(state.filter === c.id);
      chip.innerHTML = c.label + '<span class="count">' + count + '</span>';
      chip.addEventListener('click', () => {
        state.filter = c.id;
        state.order = currentOrder();
        state.pos = 0;
        renderChips();
        renderQuestion();
      });
      chipRow.appendChild(chip);
    });
  }

  // ---------- mode toggle ----------
  modeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (!btn) return;
    state.mode = btn.dataset.mode;
    [...modeToggle.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b === btn));
    renderQuestion();
  });

  // ---------- stats ----------
  function renderStats() {
    const answered = Object.keys(state.answers).length;
    const correct = Object.values(state.answers).filter(a => a.correct).length;
    const wrong = answered - correct;
    statProgress.textContent = answered + ' / ' + QUESTIONS.length;
    statCorrect.textContent = String(correct);
    statWrong.textContent = String(wrong);
    progressFill.style.width = (answered / QUESTIONS.length * 100).toFixed(1) + '%';
  }

  // ---------- render question ----------
  function renderQuestion() {
    if (state.order.length === 0) { state.order = currentOrder(); }
    if (state.pos >= state.order.length) state.pos = state.order.length - 1;
    if (state.pos < 0) state.pos = 0;

    const id = state.order[state.pos];
    const q = byId(id);
    const meta = catMeta[q.category];

    catTag.textContent = meta.label;
    catTag.style.setProperty('--cat-color', meta.color);
    qIndex.textContent = (state.pos + 1) + ' / ' + state.order.length + '　（全体 #' + q.id + '）';

    // split tree ascii block out of prompt if present
    let promptStr = q.prompt;
    let asciiBlock = '';
    const asciiMatch = promptStr.match(/【木の構造[\s\S]*$/);
    if (asciiMatch) {
      asciiBlock = asciiMatch[0];
      promptStr = promptStr.slice(0, asciiMatch.index).trim();
    }
    if (asciiBlock) {
      treeSlot.innerHTML = '<div class="tree-ascii"></div>';
      treeSlot.querySelector('.tree-ascii').textContent = asciiBlock;
    } else {
      treeSlot.innerHTML = '';
    }

    promptText.textContent = promptStr;

    codeBlock.textContent = q.code;
    codeBlock.className = 'language-javascript';
    if (window.Prism) { Prism.highlightElement(codeBlock); }

    // reset explain
    explainEl.classList.remove('show');
    verdictEl.textContent = '';
    verdictEl.className = 'verdict';
    explainTextEl.textContent = '';

    optionsEl.innerHTML = '';
    flashRevealWrap.style.display = 'none';

    const prevAnswer = state.answers[q.id];
    const flashRevealed = !!state.revealed[q.id];

    if (state.mode === 'quiz') {
      q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.type = 'button';
        btn.textContent = optText;
        optionsEl.appendChild(btn);

        if (prevAnswer) {
          btn.disabled = true;
          if (i === q.correct) btn.classList.add('correct');
          if (i === prevAnswer.chosenIndex && i !== q.correct) btn.classList.add('incorrect');
        } else {
          btn.addEventListener('click', () => {
            const isCorrect = (i === q.correct);
            state.answers[q.id] = { chosenIndex: i, correct: isCorrect };
            saveState();
            renderStats();
            renderQuestion();
          });
        }
      });

      if (prevAnswer) {
        showExplain(prevAnswer.correct, q.explanation);
      }
    } else {
      // flashcard mode: show options as plain reference list (non-interactive), reveal button shows answer
      q.options.forEach((optText, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.type = 'button';
        btn.textContent = optText;
        btn.disabled = true;
        if (flashRevealed && i === q.correct) btn.classList.add('reveal-correct');
        optionsEl.appendChild(btn);
      });

      if (!flashRevealed) {
        flashRevealWrap.style.display = 'block';
      } else {
        showExplain(true, q.explanation, true);
      }
    }
  }

  flashRevealBtn.addEventListener('click', () => {
    const id = state.order[state.pos];
    state.revealed[id] = true;
    saveState();
    renderQuestion();
  });

  function showExplain(correct, text, isFlash) {
    explainEl.classList.add('show');
    if (isFlash) {
      verdictEl.textContent = '解説';
      verdictEl.classList.add('good');
    } else {
      verdictEl.textContent = correct ? '正解!' : '不正解';
      verdictEl.classList.add(correct ? 'good' : 'bad');
    }
    explainTextEl.textContent = text;
  }

  // ---------- nav ----------
  prevBtn.addEventListener('click', () => {
    state.pos = Math.max(0, state.pos - 1);
    renderQuestion();
    scrollToCard();
  });
  nextBtn.addEventListener('click', () => {
    state.pos = Math.min(state.order.length - 1, state.pos + 1);
    renderQuestion();
    scrollToCard();
  });
  jumpBtn.addEventListener('click', doJump);
  jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') doJump(); });
  function doJump() {
    const n = parseInt(jumpInput.value, 10);
    if (!isNaN(n) && n >= 1 && n <= state.order.length) {
      state.pos = n - 1;
      renderQuestion();
      scrollToCard();
    }
    jumpInput.value = '';
  }
  function scrollToCard() {
    document.getElementById('card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- init ----------
  state.order = currentOrder();
  renderChips();
  renderStats();
  renderQuestion();
})();
</script>
</body>
</html>
